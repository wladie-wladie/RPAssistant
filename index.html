    };
    f.oninput=e=>{if(e.target.name==='preset')return;apply()};
    f.preset.onchange=()=>{const p=MAP_PRESETS[f.preset.value];if(!p)return;for(const k of ['grid','cellM','unit','cols','rows','base'])if(f[k])f[k].value=p[k];apply()};
    const bf=el.querySelector('[data-bgfile]');
    bf.onchange=async()=>{const file=bf.files[0];if(!file)return;toast('Загружаю фон…');try{const {blob,ext,w,h}=await loadImage(file);const src=await API.upload(this.ctx.pid,blob,ext);const bw=this.S.cols;await this.saveSettings({bg:{src,x:0,y:0,w:bw,ratio:h/w,opacity:1}});close();this.settingsModal();toast('Фон загружен — при необходимости подгоните его под сетку')}catch(e){toast('Не удалось загрузить картинку','err')}};
    el.querySelector('[data-bgdel]')?.addEventListener('click',()=>{this.saveSettings({bg:null});close();this.settingsModal()});
    el.querySelector('[data-bgfit]')?.addEventListener('click',()=>{const b=this.S.bg;this.saveSettings({bg:{...b,x:0,y:0,w:this.S.cols}});close();this.settingsModal()});
  }

  /* ---------- инструменты ---------- */
  toolPop(id){
    const b=this.board;
    if(id==='wall')return `<div class="lbl">Стена</div><div class="r col">${WALLS.map(([n,c,w])=>`<button class="wide ${b.preset?.stroke===c&&b.preset?.width===w?'on':''}" data-wall="${c}|${w}"><span style="display:inline-block;width:34px;height:${Math.min(w,12)}px;background:${c};border-radius:2px;vertical-align:middle"></span> ${n}</button>`).join('')}</div>`;
    if(id==='room')return `<div class="lbl">Пол</div><div class="r">${MATERIALS.map(([n,c])=>`<button title="${n}" data-mat="${c}" class="${b.preset?.fill===c?'on':''}"><span class="sw" style="background:${c};border-radius:4px"></span></button>`).join('')}</div><div class="lbl">Стены комнаты</div><div class="r">${[0,4,8,12].map(w=>`<button data-rsw="${w}" class="${b.preset?.sw===w?'on':''}" title="${w?'Толщина '+w:'Без стен'}">${w?`<span style="display:block;width:20px;height:16px;border:${Math.max(1,w/2.5)}px solid #2f2a26;border-radius:2px"></span>`:'—'}</button>`).join('')}</div>`;
    if(id==='area')return `<div class="lbl">Зона</div><div class="r col">${AREAS.map(([n,c,s])=>`<button class="wide ${b.preset?.fill===c?'on':''}" data-area="${c}|${s}"><span class="sw" style="background:${c};border-color:${s}"></span> ${n}</button>`).join('')}</div><div class="lbl">Форма</div><div class="r">${['ellipse','rect','round','hexagon','diamond'].map(k=>`<button data-akind="${k}" class="${b.preset?.kind===k?'on':''}">${shapeIcon(k)}</button>`).join('')}</div>`;
    if(id==='prop')return `<div class="lbl">Значок</div><div class="r emo">${MAP_EMOJI.map(e=>`<button data-emoji="${e}" class="${b.propEmoji===e?'on':''}">${e}</button>`).join('')}</div>`;
    if(id==='tpl'){
      const card=(t,custom)=>`<button class="tplc ${this.pendingTpl?.id===t.id?'on':''}" data-tpl="${t.id}" title="${esc(t.name)}">${tplPreview(t.items)}<span>${esc(t.name)}</span>${custom?`<i data-tpldel="${t.id}" title="Удалить шаблон">×</i>`:''}</button>`;
      const custom=this.ctx.templates();
      return `<div class="lbl">Объекты</div><div class="r tpls">${BUILTIN_TEMPLATES.map(t=>card(t)).join('')}</div>${custom.length?`<div class="lbl">Шаблоны проекта</div><div class="r tpls">${custom.map(t=>card(t,1)).join('')}</div>`:''}<div class="tplhint">Свой шаблон: выделите объекты на карте → «В шаблоны»</div>`;
    }
    return '';
  }
  onToolPop(btn,_b,ev){
    const b=this.board,d=btn.dataset,mem=v=>{b.presetMem[b.toolId]=Object.assign(b.presetMem[b.toolId]||{},v);Object.assign(b.preset,v)};
    if(d.wall){const [c,w]=d.wall.split('|');mem({stroke:c,width:+w});return 'hide'}
    if(d.mat){mem({fill:d.mat});return 'hide'}
    if(d.rsw){mem({sw:+d.rsw});return true}
    if(d.area){const [c,s]=d.area.split('|');mem({fill:c,stroke:s});return 'hide'}
    if(d.akind){mem({kind:d.akind});return true}
    if(d.emoji){b.propEmoji=d.emoji;return 'hide'}
    if(d.tpl){
      if(ev&&ev.target.dataset.tpldel){this.deleteTemplate(ev.target.dataset.tpldel);return true}
      this.pendingTpl=[...BUILTIN_TEMPLATES,...this.ctx.templates()].find(t=>t.id===d.tpl)||null;
      b.hintEl.textContent=this.pendingTpl?`Кликайте на карте, чтобы поставить «${this.pendingTpl.name}». Другой объект — снова нажмите кнопку «Объекты» (O)`:'';return 'hide';
    }
    return false;
  }
  toolDown(id,e,p){
    const b=this.board;
    if(id==='tpl'){
      if(!this.pendingTpl){toast('Сначала выберите объект в панели слева');return null}
      const sp=this.S.snap&&this.S.grid==='square'&&!e.altKey?{x:Math.floor(p.x/CELL)*CELL,y:Math.floor(p.y/CELL)*CELL}:p;
      b.insertTemplate(clone(this.pendingTpl.items),sp);return null;
    }
    if(id==='token'){this.addToken(p);return null}
    if(id==='ping'){this.ping(p,true);return null}
    if(id==='ruler'){
      const a=this.S.grid==='none'||e.altKey?p:this.snapToken(p.x,p.y,1);
      let last=0;
      return {move:(q,ev)=>{const bb=this.S.grid==='none'||ev.altKey?q:this.snapToken(q.x,q.y,1);this.drawRuler('me',a,bb,this.myColor,this.me.name);const n=Date.now();if(n-last>60){last=n;this.ch?.send({type:'broadcast',event:'ruler',payload:{id:this.me.id,a,b:bb,color:this.myColor,name:this.me.name}})}},
              up:()=>{setTimeout(()=>{this.drawRuler('me',null);this.ch?.send({type:'broadcast',event:'ruler',payload:{id:this.me.id,a:null}})},1400)}};
    }
    if(id==='reveal'||id==='hide'){
      const sn=q=>this.S.grid==='square'&&this.S.snap&&!e.altKey?this.snapV(q.x,q.y):q;
      const a=sn(p);let rect=null;
      return {move:(q)=>{const c=sn(q);rect={x:Math.min(a.x,c.x),y:Math.min(a.y,c.y),w:Math.abs(c.x-a.x),h:Math.abs(c.y-a.y)};this.L.fx.querySelector('.fogsel')?.remove();this.L.fx.insertAdjacentHTML('beforeend',`<rect class="fogsel" x="${rect.x}" y="${rect.y}" width="${rect.w}" height="${rect.h}" fill="${id==='reveal'?'rgba(255,255,255,.25)':'rgba(0,0,0,.35)'}" stroke="${id==='reveal'?'#e3b75b':'#1f2937'}" stroke-width="3" stroke-dasharray="10 6"/>`)},
              up:()=>{this.L.fx.querySelector('.fogsel')?.remove();if(!rect||rect.w<4||rect.h<4)return;this.fog.enabled=true;this.fog.ops.push({t:id==='reveal'?'r':'h',...rect});if(this.fog.ops.length>400)this.fog.ops=this.fog.ops.slice(-400);this.renderFog();this.renderHead();this.saveFog()}};
    }
    return null;
  }
  drawRuler(key,a,b,color,name){
    const fx=this.L.fx;fx.querySelector(`[data-r="${key}"]`)?.remove();if(!a||!b)return;
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)/CELL*this.S.cellM;
    const cells=this.S.grid==='square'?Math.max(Math.abs(dx),Math.abs(dy))/CELL:this.S.grid==='hex'?Math.round(Math.hypot(dx,dy)/CELL):null;
    const lbl=`${fmtNum(dist)} ${this.S.unit}${cells!=null&&cells>0?` · ${Math.round(cells)} кл.`:''}`;
    const z=this.board.view.z,fs=14/z,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    fx.insertAdjacentHTML('beforeend',`<g data-r="${key}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${4/z}" stroke-dasharray="${10/z} ${6/z}" stroke-linecap="round"/><circle cx="${a.x}" cy="${a.y}" r="${5/z}" fill="${color}"/><circle cx="${b.x}" cy="${b.y}" r="${5/z}" fill="${color}"/>
      <g transform="translate(${mx} ${my})"><rect x="${-fs*4.2}" y="${-fs*1.9}" width="${fs*8.4}" height="${fs*1.6}" rx="${fs*.4}" fill="#1f2337" opacity=".9"/><text y="${-fs*.65}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff" font-family="Manrope,sans-serif">${esc(lbl)}</text></g>${name&&key!=='me'?`<text x="${b.x+8/z}" y="${b.y-8/z}" font-size="${12/z}" fill="${color}" font-weight="700" font-family="Manrope,sans-serif">${esc(name)}</text>`:''}</g>`);
  }
  ping(p,send){
    const fx=this.L.fx,z=this.board.view.z,c=send?this.myColor:(p.color||'#e3b75b');
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="${8/z}" fill="${c}"/><circle class="pingr" cx="${p.x}" cy="${p.y}" r="${10/z}" fill="none" stroke="${c}" stroke-width="${4/z}"/><circle class="pingr d2" cx="${p.x}" cy="${p.y}" r="${10/z}" fill="none" stroke="${c}" stroke-width="${3/z}"/>`;
    g.style.setProperty('--pr',60/z+'px');fx.appendChild(g);setTimeout(()=>g.remove(),2200);
    if(send)this.ch?.send({type:'broadcast',event:'ping',payload:{x:p.x,y:p.y,color:c}});
  }

  /* ---------- фишки ---------- */
  async loadTokens(){const {data,error}=await sb.from('map_tokens').select('*').eq('map_id',this.map.id);if(!error){this.tokens=new Map((data||[]).map(t=>[t.id,t]));this.renderTokens()}}
  canMove(t){return this.canEdit||(t.owner_id===this.me.id&&this.map.shared)}
  renderTokens(){
    const L=this.L.tok;if(!L)return;
    for(const [id,el] of this.tokEls)if(!this.tokens.has(id)){el.remove();this.tokEls.delete(id)}
    for(const t of this.tokens.values()){
      let el=this.tokEls.get(t.id);
      if(!el){el=document.createElement('div');el.className='tok';el.dataset.tok=t.id;L.appendChild(el);this.tokEls.set(t.id,el);this.bindToken(el)}
      const s=(+t.size||1)*CELL,mine=t.owner_id===this.me.id;
      el.style.cssText=`left:${t.x-s/2}px;top:${t.y-s/2}px;width:${s}px;height:${s}px;z-index:${mine&&!this.canEdit?100004:100000};--tc:${t.color};`;
      el.className='tok'+(mine?' mine':'')+(t.hidden?' hid':'')+(this.selTok===t.id?' sel':'')+(this.canMove(t)?' movable':'');
      const ini=(t.name||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
      const hp=t.hp_max?`<div class="tk-hp"><i style="width:${clamp((t.hp??t.hp_max)/t.hp_max*100,0,100)}%"></i></div>`:'';
      const html=`<div class="tk-c" style="${t.img?`background-image:url('${esc(t.img)}')`:''}">${t.img?'':esc(ini)}</div>${hp}${t.name?`<div class="tk-n">${esc(t.name)}</div>`:''}`;
      if(el._h!==html){el.innerHTML=html;el._h=html}
    }
  }
  bindToken(el){
    el.addEventListener('pointerdown',e=>{
      const t=this.tokens.get(el.dataset.tok);if(!t||e.button!==0)return;
      if(!this.canMove(t)||this.board.tool==='ruler'||this.board.tool==='ping'||this.board.toolId==='reveal'||this.board.toolId==='hide')return;
      e.stopPropagation();e.preventDefault();
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      const p0=this.board.toWorld(e),ox=t.x-p0.x,oy=t.y-p0.y,sx=e.clientX,sy=e.clientY,start={x:t.x,y:t.y};let moved=false,last=0;
      const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;moved=true;const p=this.board.toWorld(ev);t.x=p.x+ox;t.y=p.y+oy;this.renderTokens();
        this.drawRuler('tok',start,{x:t.x,y:t.y},t.color,null);
        const n=Date.now();if(n-last>50){last=n;this.ch?.send({type:'broadcast',event:'tokmove',payload:{id:t.id,x:t.x,y:t.y}})}};
      const up=async ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);this.drawRuler('tok',null);
        if(!moved){if(this.canEdit)this.openTokenPanel(t.id);return}
        const sp=ev.altKey?{x:t.x,y:t.y}:this.snapToken(t.x,t.y,t.size);t.x=sp.x;t.y=sp.y;this.renderTokens();
        this.ch?.send({type:'broadcast',event:'tokmove',payload:{id:t.id,x:t.x,y:t.y}});
        const {error}=await sb.rpc('move_token',{t:t.id,nx:t.x,ny:t.y,cl:CLIENT_ID});if(error){fail(error);t.x=start.x;t.y=start.y;this.renderTokens()}};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    });
    el.addEventListener('dblclick',e=>{if(this.canEdit){e.stopPropagation();this.openTokenPanel(el.dataset.tok)}});
  }
  async addToken(p,extra={}){
    const n=this.tokens.size,sp=this.snapToken(p.x,p.y,extra.size||1);
    const row={map_id:this.map.id,project_id:this.ctx.pid,name:extra.name??`NPC ${n+1}`,color:extra.color||TOKEN_COLORS[(n+1)%TOKEN_COLORS.length],x:sp.x,y:sp.y,size:extra.size||1,owner_id:extra.owner_id||null,client:CLIENT_ID};
    const {data,error}=await sb.from('map_tokens').insert(row).select().single();if(fail(error))return;
    this.tokens.set(data.id,data);this.renderTokens();if(!extra.silent)this.openTokenPanel(data.id);return data;
  }
  async addPlayerTokens(){
    const mem=(await this.ctx.members()).filter(m=>m.role!=='comaster');
    if(!mem.length)return toast('В игре пока нет игроков — пригласите их кнопкой «Пригласить»','err');
    const have=new Set([...this.tokens.values()].map(t=>t.owner_id));
    const c=this.board.centerWorld();let k=0;
    for(const m of mem){if(have.has(m.user_id))continue;await this.addToken({x:c.x+(k%4)*CELL,y:c.y+Math.floor(k/4)*CELL},{name:m.profile?.name||'Игрок',owner_id:m.user_id,color:TOKEN_COLORS[k%TOKEN_COLORS.length],silent:true});k++}
    toast(k?`Добавлено фишек: ${k}. Игроки смогут двигать свои фишки, когда карта открыта.`:'У всех игроков уже есть фишки на этой карте');
  }
  async openTokenPanel(id){
    const t=this.tokens.get(id);if(!t)return;this.selTok=id;this.renderTokens();
    const mem=await this.ctx.members();
    const P=this.panel;P.hidden=false;
    P.innerHTML=`<div class="tp-h"><b>Фишка</b><button class="tic" data-x title="Закрыть">×</button></div>
      <label class="f">Имя<input name="name" value="${esc(t.name)}" maxlength="40"></label>
      <div class="f">Цвет<div class="colors sm">${TOKEN_COLORS.map(c=>`<button type="button" data-col="${c}" class="${c===t.color?'on':''}" style="background:${c}"></button>`).join('')}</div></div>
      <div class="f">Портрет<div class="row-g"><label class="btn sm">${t.img?'Заменить':'Загрузить'}<input type="file" accept="image/*" hidden data-img></label>${t.img?'<button class="btn sm ghost" data-noimg>Убрать</button>':''}</div></div>
      <label class="f">Размер<select name="size">${[[.5,'Крошечный (½ клетки)'],[1,'Средний (1 клетка)'],[2,'Большой (2×2)'],[3,'Огромный (3×3)'],[4,'Громадный (4×4)']].map(([v,n])=>`<option value="${v}" ${+t.size===v?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="f">Кто управляет<select name="owner"><option value="">Только мастер</option>${mem.map(m=>`<option value="${m.user_id}" ${t.owner_id===m.user_id?'selected':''}>${esc(m.profile?.name||'Участник')}${m.role==='comaster'?' (сомастер)':''}</option>`).join('')}</select></label>
      <div class="grid2"><label class="f">Здоровье<input name="hp" type="number" value="${t.hp??''}" placeholder="—"></label><label class="f">Максимум<input name="hp_max" type="number" value="${t.hp_max??''}" placeholder="—"></label></div>
      <label class="chk"><input type="checkbox" name="hidden" ${t.hidden?'checked':''}> Скрыта от игроков</label>
      <div class="row-g" style="margin-top:12px"><button class="btn sm" data-center>Показать</button><button class="btn sm danger" data-del>${ICON.trash} Удалить</button></div>`;
    const upd=async patch=>{Object.assign(t,patch);this.renderTokens();const {error}=await sb.from('map_tokens').update({...patch,client:CLIENT_ID,updated_at:new Date().toISOString()}).eq('id',t.id);if(error)fail(error);if('hidden' in patch&&patch.hidden)this.ch?.send({type:'broadcast',event:'tokgone',payload:{id:t.id}})};
    const q=s=>$(s,P);
    q('[data-x]').onclick=()=>this.closeTokenPanel();
    q('[name=name]').onchange=e=>upd({name:e.target.value.trim()});
    $$('[data-col]',P).forEach(b=>b.onclick=()=>{upd({color:b.dataset.col});$$('[data-col]',P).forEach(x=>x.classList.toggle('on',x===b))});
    q('[name=size]').onchange=e=>{const s=+e.target.value,sp=this.snapToken(t.x,t.y,s);upd({size:s,x:sp.x,y:sp.y})};
    q('[name=owner]').onchange=e=>upd({owner_id:e.target.value||null});
    q('[name=hp]').onchange=e=>upd({hp:e.target.value===''?null:+e.target.value});
    q('[name=hp_max]').onchange=e=>upd({hp_max:e.target.value===''?null:+e.target.value});
    q('[name=hidden]').onchange=e=>upd({hidden:e.target.checked});
    q('[data-img]').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const {blob,ext}=await loadImage(f);const src=await API.upload(this.ctx.pid,blob,ext);await upd({img:src});this.openTokenPanel(t.id)}catch(_){toast('Не удалось загрузить картинку','err')}};
    q('[data-noimg]')?.addEventListener('click',()=>{upd({img:null});this.openTokenPanel(t.id)});
    q('[data-center]').onclick=()=>this.centerOn(t.x,t.y);
    q('[data-del]').onclick=async()=>{const {error}=await sb.from('map_tokens').delete().eq('id',t.id);if(fail(error))return;this.tokens.delete(t.id);this.ch?.send({type:'broadcast',event:'tokgone',payload:{id:t.id}});this.closeTokenPanel()};
  }
  closeTokenPanel(){this.selTok=null;this.panel.hidden=true;this.panel.innerHTML='';this.renderTokens()}

  /* ---------- шаблоны ---------- */
  saveTemplate(sel){
    const {el,close}=openModal(`<h3>Сохранить как шаблон</h3><form><label class="f">Название<input name="n" required maxlength="40" placeholder="Например: Барная стойка"></label><label class="f">Значок в списке<input name="i" maxlength="4" value="📦"></label><p class="muted" style="font-size:12px">Шаблон появится в инструменте «Объекты» (O) у всех мастеров этого проекта.</p><div class="modal-actions"><button type="button" class="btn" data-close>Отмена</button><button class="btn primary">Сохранить</button></div></form>`);
    el.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
    const f=el.querySelector('form');f.n.focus();
    f.onsubmit=async e=>{e.preventDefault();
      const items=clone(sel).map(i=>{delete i.locked;delete i.g;return i});
      const B=union(items.map(i=>this.board.bounds(i)));
      for(const i of items){if(i.type==='line'){for(const k of ['from','to'])if(!i[k].id)i[k]={x:i[k].x-B.x,y:i[k].y-B.y};else{const s=this.board.idx.get(i[k].id);if(!sel.includes(s)){const c=center(rotBox(s));i[k]={x:c.x-B.x,y:c.y-B.y}}}}else{i.x-=B.x;i.y-=B.y}}
      const {error}=await sb.from('map_templates').insert({project_id:this.ctx.pid,name:f.n.value.trim(),icon:f.i.value.trim()||'📦',items,created_by:this.me.id});
      if(fail(error))return;close();await this.ctx.reloadTemplates();toast('Шаблон сохранён — он в инструменте «Объекты» (O)');
    };
  }
  async deleteTemplate(id){if(!await confirmBox('Удалить этот шаблон проекта?'))return;const {error}=await sb.from('map_templates').delete().eq('id',id);if(fail(error))return;await this.ctx.reloadTemplates();this.board.renderToolPop()}

  /* ---------- синхронизация ---------- */
  async push(){
    const b=this.board;if(this.inflight){this.again=true;return}
    const ops=b.diffOps();if(!ops)return;this.inflight=true;
    try{const {error}=await sb.rpc('apply_map_ops',{m:this.map.id,ups:ops.ups,dels:ops.dels,ord:ops.ord,cl:CLIENT_ID});if(error)throw error;b.base=Board.applyOps(b.base,ops)}
    catch(e){console.error(e);toast('Карта не сохранилась — проверьте связь','err');setTimeout(()=>this.push(),3000)}
    finally{this.inflight=false;if(this.again){this.again=false;this.push()}}
  }
  subscribe(){
    const id=this.map.id;
    this.ch=sb.channel('map:'+id,{config:{broadcast:{self:false}}})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'maps',filter:`id=eq.${id}`},pl=>{
        const r=pl.new;if(!r||r.client===CLIENT_ID)return;
        if(r.items)this.board.applyRemote(r.items);
        if(JSON.stringify(r.settings)!==JSON.stringify(this.S)){this.S=normSettings(r.settings);this.renderLayers()}
        if(r.fog&&JSON.stringify(r.fog)!==JSON.stringify(this.fog)){this.fog=r.fog;this.renderFog()}
        this.map.name=r.name;this.map.shared=r.shared;this.renderHead();
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'map_tokens',filter:`map_id=eq.${id}`},pl=>{
        if(pl.eventType==='DELETE'){this.tokens.delete(pl.old.id);this.renderTokens();return}
        const r=pl.new;if(!r)return;if(r.client===CLIENT_ID&&this.tokens.has(r.id))return;
        if(r.hidden&&!this.canEdit){this.tokens.delete(r.id)}else this.tokens.set(r.id,r);this.renderTokens();
      })
      .on('broadcast',{event:'tokmove'},({payload:p})=>{const t=this.tokens.get(p.id);if(t){t.x=p.x;t.y=p.y;this.renderTokens()}})
      .on('broadcast',{event:'tokgone'},({payload:p})=>{if(!this.canEdit){this.tokens.delete(p.id);this.renderTokens()}})
      .on('broadcast',{event:'ruler'},({payload:p})=>this.drawRuler('u'+p.id,p.a,p.b,p.color,p.name))
      .on('broadcast',{event:'ping'},({payload:p})=>this.ping(p,false))
      .on('broadcast',{event:'unshare'},()=>{if(!this.canEdit){toast('Мастер скрыл эту карту');this.ctx.onBack(true)}})
      .subscribe();
  }
}

/* ---------- общий канал проекта: «позвать на карту» ---------- */
class ProjectHub{
  constructor(pid,canEdit){this.pid=pid;this.canEdit=canEdit;this.ch=sb.channel('proj:'+pid,{config:{broadcast:{self:false}}})
    .on('broadcast',{event:'follow'},({payload:p})=>{if(this.canEdit)return;LS.set('rpa_map_'+pid,p.mapId);
      if(App.mapsTab&&App.mapsTab.pid===pid){App.mapsTab.open(p.mapId,true);toast(`Мастер открыл карту «${p.name}»`)}
      else toastAction(`Мастер зовёт на карту «${p.name}»`,'Открыть',()=>go('project',pid,'maps'))})
    .on('broadcast',{event:'maps'},()=>{if(App.mapsTab&&App.mapsTab.pid===pid)App.mapsTab.reload()})
    .subscribe()}
  follow(mapId,name){this.ch.send({type:'broadcast',event:'follow',payload:{mapId,name}})}
  mapsChanged(){this.ch.send({type:'broadcast',event:'maps',payload:{}})}
  destroy(){sb.removeChannel(this.ch)}
}
function toastAction(msg,label,fn){const t=document.createElement('div');t.className='toast act';t.innerHTML=`<span>${esc(msg)}</span><button class="btn primary sm">${esc(label)}</button>`;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));const kill=()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)};t.querySelector('button').onclick=()=>{kill();fn()};setTimeout(kill,15000)}

/* ---------- вкладка «Карты» ---------- */
function renderMapsTab(main,pid,isM){
  main.innerHTML=`<div class="maps"><aside class="mlist"><div class="mlist-h"><b>Карты</b>${isM?'<button class="btn primary sm" data-newmap>+ Новая</button>':''}</div><div class="ml"></div></aside><section class="mmain"></section></div>`;
  const ml=$('.ml',main),mm=$('.mmain',main);
  let maps=[],view=null,templates=[],members=null;
  const T={pid,
    templates:()=>templates,
    async reloadTemplates(){if(!isM)return;const {data}=await sb.from('map_templates').select('*').eq('project_id',pid).order('created_at');templates=data||[];view?.board.renderToolPop()},
    async members(){if(!members)members=await API.members(pid).catch(()=>[]);return members},
    async reload(){
      const {data,error}=await sb.from('maps').select('id,name,settings,shared,updated_at').eq('project_id',pid).order('sort').order('created_at');
      if(error){fail(error);return}maps=data||[];drawList();
      if(view&&!maps.some(m=>m.id===view.map.id)){closeView();drawEmpty()}
    },
    async open(id,force){
      if(view&&view.map.id===id&&!force)return;
      const {data,error}=await sb.from('maps').select('*').eq('id',id).maybeSingle();
      if(error||!data){toast('Карта недоступна','err');LS.set('rpa_map_'+pid,null);closeView();drawEmpty();return}
      closeView();LS.set('rpa_map_'+pid,id);main.querySelector('.maps').classList.add('open');
      view=new MapView(mm,data,{canEdit:isM,pid,templates:()=>templates,reloadTemplates:()=>T.reloadTemplates(),members:()=>T.members(),onBack:(gone)=>{LS.set('rpa_map_'+pid,null);closeView();drawEmpty();if(gone)T.reload()},onListChange:()=>T.reload()});
      App.mapView=view;drawList();
    },
  };
  App.mapsTab=T;
  const closeView=()=>{if(view){view.destroy();view=null;App.mapView=null}main.querySelector('.maps')?.classList.remove('open');drawList()};
  const drawEmpty=()=>{mm.innerHTML=`<div class="soon"><div class="panel"><div class="ic">🗺️</div><h2>${isM?'Карты локаций':'Карты'}</h2><p class="muted">${isM?'Создайте карту: подземелье, таверну, улицу или целый регион. Расставьте стены, мебель и фишки, включите туман войны и откройте карту игрокам одной кнопкой.':'Здесь появятся карты, которые мастер откроет вам. На них можно двигать свою фишку и мерить расстояние.'}</p>${isM?'<button class="btn primary" data-newmap2>+ Создать карту</button>':''}</div></div>`;mm.querySelector('[data-newmap2]')?.addEventListener('click',newMap)};
  const drawList=()=>{
    const cur=view?.map.id;
    ml.innerHTML=maps.length?maps.map(m=>{const S=normSettings(m.settings);return `<div class="mli ${m.id===cur?'on':''}" data-id="${m.id}"><div class="mli-t">${ICON.map}<span>${esc(m.name)}</span>${isM?`<i class="eye ${m.shared?'on':''}" title="${m.shared?'Видна игрокам':'Скрыта от игроков'}">${m.shared?ICON.eye:ICON.hide}</i>`:''}</div><div class="mli-m">${S.grid==='none'?'без сетки':`${S.cols}×${S.rows} · ${fmtNum(S.cellM)} ${S.unit}`}</div>${isM?`<div class="mli-a"><button data-dup title="Копия">${ICON.copy}</button><button data-del title="Удалить">${ICON.trash}</button></div>`:''}</div>`}).join('')
      :`<div class="muted" style="padding:14px;font-size:13px">${isM?'Пока нет карт':'Мастер ещё не открыл вам карты'}</div>`;
  };
  ml.onclick=async e=>{
    const it=e.target.closest('.mli');if(!it)return;const m=maps.find(x=>x.id===it.dataset.id);
    if(e.target.closest('[data-del]')){if(await confirmBox(`Удалить карту «${m.name}» со всеми фишками?`)){const {error}=await sb.from('maps').delete().eq('id',m.id);if(!fail(error)){if(view?.map.id===m.id){closeView();drawEmpty()}App.hub?.mapsChanged();T.reload()}}return}
    if(e.target.closest('[data-dup]')){const {data:full}=await sb.from('maps').select('*').eq('id',m.id).single();const {error}=await sb.from('maps').insert({project_id:pid,name:full.name+' (копия)',settings:full.settings,items:full.items,fog:full.fog,shared:false,sort:maps.length});if(!fail(error))T.reload();return}
    T.open(m.id);
  };
  const newMap=()=>{
    const {el,close}=openModal(`<h3>Новая карта</h3><form><label class="f">Название<input name="n" required maxlength="80" placeholder="Например: Подвал таверны"></label>
      <div class="f">Тип карты<div class="presets">${Object.entries(MAP_PRESETS).map(([k,p],i)=>`<label class="pre"><input type="radio" name="p" value="${k}" ${i?'':'checked'}><span><b>${esc(p.label.split(' — ')[0])}</b><small>${esc(p.label.split(' — ')[1]||'')} · ${p.cols}×${p.rows}</small></span></label>`).join('')}</div></div>
      <p class="muted" style="font-size:12px;margin:-4px 0 16px">Размер, сетку и фоновую картинку можно поменять в любой момент кнопкой «Сетка и фон».</p>
      <div class="modal-actions"><button type="button" class="btn" data-close>Отмена</button><button class="btn primary">Создать</button></div></form>`);
    el.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
    const f=el.querySelector('form');f.n.focus();
    f.onsubmit=async e=>{e.preventDefault();const p=MAP_PRESETS[f.p.value];const {label,...settings}=p;
      const {data,error}=await sb.from('maps').insert({project_id:pid,name:f.n.value.trim(),settings:normSettings(settings),sort:maps.length}).select('id').single();
      if(fail(error))return;close();await T.reload();T.open(data.id)};
  };
  main.querySelectorAll('[data-newmap]').forEach(b=>b.onclick=newMap);
  drawEmpty();
  T.reload().then(()=>{const last=LS.get('rpa_map_'+pid);if(last&&maps.some(m=>m.id===last))T.open(last)});
  T.reloadTemplates();
}

/* ============ boot ============ */
(async()=>{
  if(!sb){root().innerHTML=`<div class="fatal"><h2>${CONFIGURED?'Не удалось загрузить модуль сервера':'Сервер ещё не подключён'}</h2><p class="muted">${CONFIGURED?'Проверьте подключение к интернету и перезапустите приложение.':'В приложение нужно вписать адрес и ключ проекта Supabase.'}</p></div>`;return}
  const qs=new URLSearchParams(location.search+'&'+location.hash.slice(1));
  const invQ=qs.get('invite');if(invQ&&/^[A-Za-z0-9]{6}$/.test(invQ)){LS.set('rpa_invite',invQ.toUpperCase());history.replaceState(null,'',location.pathname)}
  const oauthErr=qs.get('error_description');
  root().innerHTML='<div class="loading"><div class="spin"></div>Загрузка…</div>';
  let session=null;
  try{session=(await sb.auth.getSession()).data.session}catch(e){console.error(e)}
  if(location.search.includes('code=')||location.hash.includes('access_token')||oauthErr)history.replaceState(null,'',location.pathname);
  if(oauthErr)toast('Вход через Google не удался: '+oauthErr,'err');
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&App.user){App.user=null;destroyBoard();go('auth')}});
  if(!session)return go('auth');
  try{enter(await API.profile())}catch(e){console.error(e);root().innerHTML='<div class="fatal"><h2>Сервер недоступен</h2><p class="muted">Проверьте интернет и обновите страницу. Если проект Supabase «уснул» после недели без использования — разбудите его в панели Supabase.</p></div>'}
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Доступна новая версия RPAssistant — она применится при следующем запуске')})});
    setInterval(()=>reg.update(),30*60*1000);
  }).catch(()=>{});
}
